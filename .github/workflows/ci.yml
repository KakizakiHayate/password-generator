name: CI

on:
  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'

jobs:
  lint:
    name: Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate dummy firebase_options.dart
        run: |
          cat > lib/firebase_options.dart << 'DART'
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform => const FirebaseOptions(
              apiKey: 'dummy',
              appId: 'dummy',
              messagingSenderId: 'dummy',
              projectId: 'dummy',
            );
          }
          DART

      - name: Get dependencies
        run: flutter pub get

      - name: Get custom lint dependencies
        run: |
          for dir in */; do
            if [ -f "$dir/pubspec.yaml" ] && grep -q "custom_lint_builder" "$dir/pubspec.yaml"; then
              echo "Found custom lint package in $dir"
              cd "$dir"
              dart pub get
              cd ..
            fi
          done

      - name: Run flutter analyze
        run: flutter analyze

      - name: Run custom_lint
        run: dart run custom_lint

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate dummy firebase_options.dart
        run: |
          cat > lib/firebase_options.dart << 'DART'
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform => const FirebaseOptions(
              apiKey: 'dummy',
              appId: 'dummy',
              messagingSenderId: 'dummy',
              projectId: 'dummy',
            );
          }
          DART

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test
