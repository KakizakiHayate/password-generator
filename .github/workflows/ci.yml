name: CI

on:
  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'

jobs:
  lint:
    name: Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Get flutter_fast_starter_lints dependencies
        run: |
          cd flutter_fast_starter_lints
          dart pub get

      - name: Run flutter analyze
        run: flutter analyze

      - name: Run custom_lint
        run: dart run custom_lint

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test
